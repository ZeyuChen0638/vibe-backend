[project]
name = "cura-backend"
version = "0.1.0"
description = "FastAPI + PostgreSQL backend for CURA"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "fastapi[standard]==0.135.1",
    "psycopg==3.3.3",
    "sqlalchemy>=2.0.48",
    "uvicorn[standard]>=0.42.0",
]

[project.scripts]
dev = "cli:dev"
start = "cli:start"
db = "cli:db"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""
